<div class="page-header">
  <div class="wrap">
    <h1>Contact the Club</h1>
  </div>
</div>

<section>
  <div class="wrap">
    <div style="max-width:560px;">

      <p class="modal-intro">Don't see your question on our <a href="/faqs/" style="color:var(--teal)">FAQ page</a>? Ask below, we will respond to you within 48 hours, but usually much sooner.</p>

      <form class="modal-form" id="ask-form">
        <div class="field">
          <label for="ask-name">Name</label>
          <input id="ask-name" type="text" required="" autocomplete="name">
        </div>
        <div class="field">
          <label for="ask-email">Email</label>
          <input id="ask-email" type="email" required="" autocomplete="email">
        </div>
        <div class="field">
          <label for="ask-question">Your message</label>
          <textarea id="ask-question" required=""></textarea>
        </div>

        <div class="field">
          <label for="ask-source">How did you find us? <span style="font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);">(optional)</span></label>
          <select id="ask-source">
            <option value="">Select one</option>
            <option>Search engine</option>
            <option>Facebook</option>
            <option>Toastmasters.org</option>
            <option>Friend / word of mouth</option>
            <option>Saw our sign</option>
            <option>Other</option>
          </select>
        </div>

        <fieldset class="check-field">
          <legend>What brings you in? <span style="display:inline; text-transform:none; letter-spacing:0; font-weight:400; color:var(--cream);">(optional)</span><span>Choose as many as you'd like</span></legend>
          <label class="checkbox-row"><input type="checkbox" name="brings" value="Get better at public speaking">Get better at public speaking</label>
          <label class="checkbox-row"><input type="checkbox" name="brings" value="Build confidence">Build confidence</label>
          <label class="checkbox-row"><input type="checkbox" name="brings" value="Think faster on my feet">Think faster on my feet</label>
          <label class="checkbox-row"><input type="checkbox" name="brings" value="Meet new people">Meet new people</label>
          <label class="checkbox-row"><input type="checkbox" name="brings" value="Improve my communication at work">Improve my communication at work</label>
          <label class="checkbox-row"><input type="checkbox" name="brings" value="Develop leadership skills">Develop leadership skills</label>
          <label class="checkbox-row"><input type="checkbox" name="brings" value="Try something different">Try something different</label>
          <label class="checkbox-row"><input type="checkbox" name="brings" value="Just curious">Just curious</label>
        </fieldset>

        <button class="btn btn-primary" type="submit">Send It Over</button>
      </form>
      <p class="rsvp-success" id="ask-success">Got it. We'll write back soon.</p>

    </div>
  </div>
</section>
